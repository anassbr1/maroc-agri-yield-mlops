[project]
name = "maroc-agri-yield"
version = "0.1.0"
description = "MLOps pipeline for Morocco agriculture yield & market price forecasting"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks", "venv", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "*/__init__.py"]
